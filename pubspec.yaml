# The name of your Flutter app (used internally)
name: zrc

# A short description that appears in package metadata
description: "A new Flutter project."

# Prevents publishing to pub.dev (recommended for private apps)
publish_to: "none"

# App version: major.minor.patch+build
version: 1.0.4+1

# Dart/Flutter SDK version required for this project
environment:
  sdk: ^3.9.2

# ------------------------------
#        DEPENDENCIES
# ------------------------------
dependencies:
  flutter:
    sdk: flutter # Core Flutter SDK

  # iOS-styled icons
  cupertino_icons: ^1.0.8

  # Package for curved bottom navigation bar
  curved_navigation_bar: ^1.0.6

  # Firebase core (app initialization)
  firebase_core: ^4.2.1

  # State management using BLoC pattern
  flutter_bloc: ^9.1.1

  # Hydration for BLoC
  hydrated_bloc: ^10.1.1

  # Responsive layout for different screen sizes
  flutter_screenutil: ^5.9.3

  # Secure local storage for sensitive data
  flutter_secure_storage: ^9.2.4

  # Display SVG images
  flutter_svg: ^2.2.2

  # Dependency injection (service locator)
  get_it: ^9.0.5

  # Supabase backend SDK (auth, database, storage)
  supabase_flutter: ^2.10.3

  # YouTube player widget for Flutter
  youtube_player_flutter: ^9.1.3

  # Internationalization
  intl: ^0.20.2

  # Localization
  easy_localization: ^3.0.8

  # Google fonts
  google_fonts: ^6.3.3

  # Arabic to Roman converter
  arabic_roman_conv: ^0.1.0-dev.2

  # Translation
  translator: ^1.0.4+1

# ------------------------------
#        DEV DEPENDENCIES
# ------------------------------
dev_dependencies:
  # Recommended lint rules
  flutter_lints: ^6.0.0

  # Flutter test framework
  flutter_test:
    sdk: flutter

# ------------------------------
#        FLUTTER SETTINGS
# ------------------------------
flutter:
  # Enables Material Design icons and theming
  uses-material-design: true

  # Asset folders included in the build
  assets:
    - assets/images/ # Image assets
    - assets/svgs/ # SVG assets
    - assets/translations/ # Localization assets


